    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #faf7f2;
            --surface-color: #ffffff;
            --primary: #c59b7b;
            --primary-dark: #a07658;
            --text-main: #3d3530;
            --text-muted: #8c827a;
            --border: #f0e6de;
            --shadow: rgba(160, 118, 88, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Kanit', sans-serif; background-color: var(--bg-color); color: var(--text-main); padding-top: 100px; line-height: 1.6; }
        
        .navbar { position: fixed; top: 0; left: 0; width: 100%; height: 80px; background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); box-shadow: 0 2px 20px var(--shadow); display: flex; align-items: center; justify-content: space-between; padding: 0 5%; z-index: 1000; border-bottom: 1px solid var(--border); }
        .nav-brand { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-box { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--primary); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .brand-text h1 { font-size: 18px; font-weight: 600; color: var(--text-main); }
        .nav-menu { display: flex; gap: 22px; list-style: none; }
        .nav-menu a { text-decoration: none; color: var(--text-main); font-size: 14px; transition: color 0.3s; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--primary); }

        .gallery-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .gallery-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; border-bottom: 2px solid var(--border); padding-bottom: 15px; }
        .gallery-header h3 { font-size: 22px; font-weight: 500; }
        .gallery-counter { font-size: 13px; color: var(--text-muted); background: var(--border); padding: 4px 12px; border-radius: 12px; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); grid-auto-rows: 320px; gap: 20px; }
        .gallery-item { position: relative; background: var(--surface-color); border-radius: 20px; overflow: hidden; box-shadow: 0 4px 15px var(--shadow); border: 1px solid var(--border); cursor: pointer; transition: all 0.4s; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
        .gallery-item:hover { transform: scale(1.03) translateY(-3px); border-color: var(--primary); }
        .gallery-item:hover img { transform: scale(1.04); }

        .gallery-item.wide { grid-column: span 2; }
        .gallery-item.tall { grid-row: span 2; }

        .item-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(61,53,48,0.7) 0%, rgba(61,53,48,0) 60%); display: flex; align-items: flex-end; padding: 20px; opacity: 0; transition: opacity 0.3s ease; }
        .gallery-item:hover .item-overlay { opacity: 1; }
        .overlay-text { color: #ffffff; }
        .overlay-text h4 { font-size: 15px; font-weight: 500; }

        .slogan-divider { max-width: 1200px; margin: 40px auto; padding: 35px 20px; text-align: center; background: linear-gradient(135deg, #fbf9f6 0%, #f5ece5 100%); border-radius: 20px; border-left: 5px solid #d4af37; }
        .slogan-divider p { font-size: 17px; font-weight: 500; color: #5c4f46; display: flex; align-items: center; justify-content: center; gap: 12px; }

        .lightbox { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .lightbox.show { display: flex; }
        .lightbox-content { max-width: 90%; max-height: 85vh; object-fit: contain; border-radius: 16px; }
        .lightbox-close { position: absolute; top: 25px; right: 35px; color: #fff; font-size: 35px; cursor: pointer; }

        @media (max-width: 900px) { .gallery-item.wide { grid-column: span 1; } }
        @media (max-width: 768px) { .gallery-grid { grid-template-columns: 1fr; grid-auto-rows: 280px; } .gallery-item.tall { grid-row: span 1; } }
    </style>
</head>

    <div id="lightboxModal" class="lightbox" onclick="closeLightbox()"><span class="lightbox-close">&times;</span><img class="lightbox-content" id="lightboxImg"></div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const storedShows = JSON.parse(localStorage.getItem('uploaded_shows') || '[]');
            const grid = document.getElementById('shows-gallery-grid');
            storedShows.forEach(imgUrl => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openLightbox(imgUrl);
                item.innerHTML = `<img src="${imgUrl}" alt="บีเกิ้ลสายประกวด">`;
                grid.appendChild(item);
            });
        });

        function openLightbox(imgUrl) {
            document.getElementById('lightboxImg').src = imgUrl;
            document.getElementById('lightboxModal').classList.add('show');
        }
        function closeLightbox() {
            document.getElementById('lightboxModal').classList.remove('show');
        }
    </script>
